name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # The TRIBE bridge tests run the real bridge against the stand-in package in tests/fixtures.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy

      - run: npm ci
      # Electron can fetch its binary lazily on first use; do it here rather than inside a test.
      - run: node -e "require('electron')"

      # Ubuntu runners restrict unprivileged user namespaces; use Electron's setuid sandbox helper.
      - name: Enable the Electron sandbox helper
        if: runner.os == 'Linux'
        run: |
          sudo chown root:root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox

      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      - name: Desktop tests
        if: runner.os == 'Linux'
        run: xvfb-run -a npx playwright test
      - name: Desktop tests
        if: runner.os == 'Windows'
        run: npx playwright test

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results-${{ matrix.os }}
          path: test-results/
          retention-days: 7
